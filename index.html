
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS Viva Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#050817;
  --panel:#101a2d;
  --card:#1b293e;
  --border:#304159;
  --text:#f5f7ff;
  --muted:#91a4bd;
  --purple:#5145e8;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
header {
  position:sticky;
  top:0;
  z-index:5;
  background:#0e1729;
  border-bottom:1px solid var(--border);
  padding:20px 3%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}
h1 {font-size:23px;margin:0 0 5px}
.sub {color:var(--muted);font-size:14px}
.tools {display:flex;gap:10px;flex-wrap:wrap}
input {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  color:white;
  min-width:250px;
}
button {
  border:0;
  cursor:pointer;
  color:white;
  border-radius:10px;
  padding:12px 16px;
  font-weight:600;
}
.secondary {background:#26354b}
.copy {background:var(--purple);width:100%}
.copy:hover {background:#7065ff}
main {padding:30px 3%;max-width:1600px;margin:auto}
.quick {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  margin-bottom:35px;
}
.quick-grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-top:20px;
}
.quick-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
}
.qdesc {
  color:var(--muted);
  font-size:13px;
  margin:12px 0;
  min-height:32px;
}
.tag,.exp-no {
  color:#aaa5ff;
  background:#292e55;
  border:1px solid #454b91;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
}
.filters {
  display:flex;
  gap:10px;
  margin-bottom:30px;
  flex-wrap:wrap;
}
.filter {background:#26354b}
.filter.active {background:var(--purple)}
.count {margin-left:auto;color:var(--muted)}
.experiment {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:18px;
  overflow:hidden;
}
.exp-head {
  display:flex;
  align-items:center;
  gap:15px;
  padding:20px;
  flex-wrap:wrap;
}
.toggle {background:#26354b;font-size:20px}
.exp-meta {flex:1;min-width:220px}
.exp-title {font-weight:700;font-size:17px}
.exp-file {
  color:var(--muted);
  margin-top:8px;
  font:13px "JetBrains Mono",monospace;
}
.actions {display:flex;gap:8px}
.download {background:#26354b}
.code-area {
  display:none;
  padding:20px;
  border-top:1px solid var(--border);
}
.experiment.open .code-area {display:block}
.experiment.open .toggle {transform:rotate(90deg)}
.codebox {
  background:#070d1b;
  color:#dbe6f6;
  padding:20px;
  border-radius:12px;
  overflow:auto;
  font:13px/1.7 "JetBrains Mono",monospace;
  white-space:pre;
  max-height:600px;
}
.empty {display:none;text-align:center;padding:40px;color:var(--muted)}
.toast {
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#164b3d;
  padding:13px 20px;
  border-radius:10px;
  display:none;
}
footer {text-align:center;color:var(--muted);padding:25px}

@media(max-width:1100px) {
  .quick-grid {grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px) {
  .quick-grid {grid-template-columns:repeat(2,1fr)}
  .tools,input {width:100%}
  .count {margin-left:0;width:100%}
  .actions {width:100%}
  .actions button {flex:1}
}
@media(max-width:400px) {
  .quick-grid {grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div>
    <h1>⌘ Data Structures Lab Experiments</h1>
    <div class="sub">9 Experiments (Exp 01 – Exp 09) • Instant One-Click Copy</div>
  </div>

  <div class="tools">
    <input id="search" placeholder="Search experiment #, title, or code...">
    <button class="secondary" id="collapseAll">Collapse All</button>
  </div>
</header>

<main>

<section class="quick">
  <h2>🟢 Quick One-Click Copy Panel</h2>
  <p class="sub">Copy complete source code with one click.</p>
  <div class="quick-grid" id="quickGrid"></div>
</section>

<nav class="filters">
  <button class="filter active" data-filter="all">All Experiments (9)</button>
  <button class="filter" data-filter="C">C Language (9)</button>
  <span class="count" id="resultCount"></span>
</nav>

<section id="experimentList"></section>
<div class="empty" id="empty">No experiments found.</div>

</main>

<footer>DS Viva Hub • Keep Practising, Keep Building.</footer>
<div class="toast" id="toast">Code copied successfully!</div>

<script src="experiments.js"></script>

<script>
const experiments = window.EXPERIMENTS || [];

const quickGrid = document.getElementById("quickGrid");
const list = document.getElementById("experimentList");
const search = document.getElementById("search");
const count = document.getElementById("resultCount");
const empty = document.getElementById("empty");

let activeFilter = "all";

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 1800);
}

async function copyCode(code) {
  try {
    await navigator.clipboard.writeText(code);
    showToast("Code copied successfully!");
  } catch (error) {
    const area = document.createElement("textarea");
    area.value = code;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    showToast("Code copied successfully!");
  }
}

function downloadCode(exp) {
  const blob = new Blob([exp.code], {
    type: "text/plain"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = exp.file;
  a.click();

  URL.revokeObjectURL(url);
  showToast("Code downloaded!");
}

function makeQuickCards() {
  quickGrid.innerHTML = "";

  experiments.forEach(exp => {
    const card = document.createElement("div");
    card.className = "quick-card";

    const title = document.createElement("strong");
    title.textContent = `Experiment ${exp.id} `;

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "C";

    const desc = document.createElement("div");
    desc.className = "qdesc";
    desc.textContent = exp.title;

    const btn = document.createElement("button");
    btn.className = "copy";
    btn.textContent = `▢ Copy Experiment ${exp.id}`;
    btn.onclick = () => copyCode(exp.code);

    title.appendChild(tag);
    card.append(title, desc, btn);
    quickGrid.appendChild(card);
  });
}

function render() {
  const term = search.value.toLowerCase().trim();

  const filtered = experiments.filter(exp => {
    const matchesSearch =
      !term ||
      String(exp.id).includes(term) ||
      exp.title.toLowerCase().includes(term) ||
      exp.code.toLowerCase().includes(term);

    const matchesFilter =
      activeFilter === "all" || activeFilter === "C";

    return matchesSearch && matchesFilter;
  });

  list.innerHTML = "";

  filtered.forEach(exp => {
    const article = document.createElement("article");
    article.className = "experiment";

    const header = document.createElement("div");
    header.className = "exp-head";

    const toggle = document.createElement("button");
    toggle.className = "toggle";
    toggle.textContent = "›";
    toggle.onclick = () => article.classList.toggle("open");

    const meta = document.createElement("div");
    meta.className = "exp-meta";

    const title = document.createElement("div");
    title.className = "exp-title";

    const number = document.createElement("span");
    number.className = "exp-no";
    number.textContent = `EXPERIMENT ${exp.id}`;

    title.append(number, document.createTextNode(" " + exp.title));

    const file = document.createElement("div");
    file.className = "exp-file";
    file.textContent =
      `${exp.file} • C Language • ${exp.code.split("\n").length} lines`;

    meta.append(title, file);

    const actions = document.createElement("div");
    actions.className = "actions";

    const download = document.createElement("button");
    download.className = "download";
    download.textContent = "↓ Download";
    download.onclick = () => downloadCode(exp);

    const copy = document.createElement("button");
    copy.className = "copy";
    copy.style.width = "auto";
    copy.textContent = "▢ Copy Code";
    copy.onclick = () => copyCode(exp.code);

    actions.append(download, copy);
    header.append(toggle, meta, actions);

    const area = document.createElement("div");
    area.className = "code-area";

    const code = document.createElement("pre");
    code.className = "codebox";
    code.textContent = exp.code;

    area.appendChild(code);
    article.append(header, area);
    list.appendChild(article);
  });

  count.textContent =
    `Showing ${filtered.length} of 9 experiments`;

  empty.style.display = filtered.length ? "none" : "block";
}

document.querySelectorAll(".filter").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter").forEach(b =>
      b.classList.remove("active")
    );

    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    render();
  };
});

search.addEventListener("input", render);

document.getElementById("collapseAll").onclick = () => {
  const articles = document.querySelectorAll(".experiment");
  const anyOpen = [...articles].some(a => a.classList.contains("open"));

  articles.forEach(article => {
    article.classList.toggle("open", !anyOpen);
  });

  document.getElementById("collapseAll").textContent =
    anyOpen ? "Expand All" : "Collapse All";
};

makeQuickCards();
render();
</script>

</body>
</html>
